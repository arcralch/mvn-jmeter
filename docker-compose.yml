version: '3.8'

services:
  jmeter-runner:
    image: maven:3.8.7-eclipse-temurin-11
    container_name: jmeter-maven-runner
    working_dir: /app
    volumes:
      # Monta el directorio actual del repositorio en el contenedor (/app)
      - .:/app
      # Volumen para cachear las dependencias de Maven y acelerar ejecuciones futuras
      - maven-repo:/root/.m2
      # Monta directorio de reportes para persistirlos localmente
      - ./target/jmeter/reports:/app/target/jmeter/reports
      - ./target/jmeter/results:/app/target/jmeter/results
    # Comando que se ejecutará al levantar el contenedor (ejecuta pruebas y genera reporte)
    command: /bin/sh -c "mvn clean verify && echo 'Report available at: target/jmeter/reports/index.html'"

volumes:
  maven-repo:
    name: jmeter-maven-repo
